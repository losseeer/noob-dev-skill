$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/solution-design/review.schema.yaml"
title: Solution design review record
type: object
additionalProperties: false
required:
  - version
  - reviewed_at
  - decision
  - checks
properties:
  version:
    const: 1
  reviewed_at:
    type: string
    format: date
  reviewer:
    type: string
  design_version:
    type: string
    pattern: "^v[0-9]+\\.[0-9]+$"
  decision:
    enum: [approve, request_changes, insufficient_evidence]
  checks:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/check"
  findings:
    type: array
    items:
      $ref: "#/$defs/finding"
  unresolved_assumptions:
    type: array
    items:
      type: string
      pattern: "^ASM-[0-9]{3}$"
  status_after:
    enum: [draft, reviewed]
  summary:
    type: string
$defs:
  check:
    type: object
    additionalProperties: false
    required: [id, item, passed]
    properties:
      id:
        type: string
        minLength: 1
      item:
        type: string
        minLength: 1
      passed:
        type: boolean
      note:
        type: string
      evidence_ref:
        type: string
  finding:
    type: object
    additionalProperties: false
    required: [severity, description, disposition]
    properties:
      severity:
        enum: [blocker, major, minor]
      description:
        type: string
        minLength: 1
      evidence_ref:
        type: string
      disposition:
        enum: [must_fix, accepted_risk, escalate, deferred]
      note:
        type: string
