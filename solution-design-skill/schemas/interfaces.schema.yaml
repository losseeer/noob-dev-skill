$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/solution-design/interfaces.schema.yaml"
title: Solution interface contract
type: object
additionalProperties: false
required:
  - version
  - interfaces
properties:
  version:
    const: 1
  protocol_note:
    type: string
  interfaces:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/interface"
$defs:
  interface:
    type: object
    additionalProperties: false
    required: [id, name, kind, acceptance_refs]
    properties:
      id:
        type: string
        pattern: "^IF-[0-9]{3}$"
      name:
        type: string
        minLength: 1
      kind:
        enum: [http, cli, event, internal, page]
      method:
        enum: [GET, POST, PUT, PATCH, DELETE]
      path:
        type: string
      request:
        type: array
        items:
          $ref: "#/$defs/param"
      response:
        type: array
        items:
          $ref: "#/$defs/param"
      errors:
        type: array
        items:
          $ref: "#/$defs/error_case"
      source_refs:
        type: array
        items:
          type: string
          pattern: "^REQ-[0-9]{3}$"
      acceptance_refs:
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^AC-[0-9]{3}$"
      page_ref:
        type: string
      note:
        type: string
    dependencies:
      kind:
        oneOf:
          - properties:
              kind:
                const: http
            required: [method, path]
          - properties:
              kind:
                const: cli
            required: [path]
          - properties:
              kind:
                const: page
            required: [page_ref]
          - properties:
              kind:
                enum: [event, internal]
  param:
    type: object
    additionalProperties: false
    required: [name, type]
    properties:
      name:
        type: string
        minLength: 1
      type:
        type: string
        minLength: 1
      required:
        type: boolean
      constraint:
        type: string
      source:
        type: string
      note:
        type: string
  error_case:
    type: object
    additionalProperties: false
    required: [code, when]
    properties:
      code:
        type: string
        minLength: 1
      when:
        type: string
        minLength: 1
      response_note:
        type: string
      acceptance_ref:
        type: string
        pattern: "^AC-[0-9]{3}$"
