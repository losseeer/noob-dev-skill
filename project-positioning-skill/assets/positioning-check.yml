name: positioning-check
on:
  pull_request:
    paths:
      - ".project/positioning/**"
      - ".skills/project-positioning/**"
  push:
    paths:
      - ".project/positioning/**"
      - ".skills/project-positioning/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install -r .skills/project-positioning/scripts/requirements.txt
      - name: Validate bundled schemas, rules, and examples
        run: python .skills/project-positioning/scripts/validate_bundle.py
      - name: Validate current positioning
        run: |
          test -f .project/positioning/current.yaml
          python .skills/project-positioning/scripts/validate_artifact.py positioning .project/positioning/current.yaml
      - name: Validate coverage matrix
        run: |
          test -f .project/positioning/coverage.yaml
          python .skills/project-positioning/scripts/validate_artifact.py coverage .project/positioning/coverage.yaml
      - name: Validate requirement gates
        shell: bash
        run: |
          shopt -s nullglob
          files=(.project/positioning/gates/*.yaml)
          for file in "${files[@]}"; do
            python .skills/project-positioning/scripts/validate_artifact.py gate "$file"
          done
