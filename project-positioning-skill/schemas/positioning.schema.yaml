$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/project-positioning/positioning.schema.yaml"
title: Project positioning card
type: object
additionalProperties: false
required:
  - version
  - status
  - updated
  - summary
  - positioning
  - non_functional_priority
  - constraints
  - do_now
  - do_not
  - reserved
  - undecided
  - reposition_triggers
  - source_summary
  - history
properties:
  version:
    type: string
    pattern: "^v[0-9]+\\.[0-9]+$"
  status:
    enum: [draft, reviewed, frozen, superseded]
  updated:
    type: string
    format: date
  summary:
    type: string
    minLength: 1
    maxLength: 200
  positioning:
    type: object
    additionalProperties: false
    required:
      - type
      - level
      - stage
      - users
      - scale
      - delivery
      - charging
      - criticality
      - compliance
      - data_sensitivity
    properties:
      type:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      level:
        enum: [L0, L1, L2, L3, L4]
      stage:
        enum: [experiment, prototype, mvp, growth, mature]
      users:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      scale:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            minLength: 1
      delivery:
        enum: [local, self_hosted, cloud, hybrid, embedded, library]
      charging:
        type: boolean
      criticality:
        enum: [none, low, medium, high]
      compliance:
        enum: [none, low, medium, high]
      data_sensitivity:
        enum: [none, internal, personal, sensitive, regulated]
  non_functional_priority:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - time_to_market
        - cost
        - simplicity
        - maintainability
        - data_safety
        - security
        - availability
        - performance
        - scalability
        - compliance
        - auditability
  constraints:
    type: object
    additionalProperties: false
    required:
      - architecture
      - database
      - deploy
      - auth
      - multi_tenant
      - audit
      - backup
      - testing
      - monitoring
      - maintenance_budget
    properties:
      architecture:
        type: string
      database:
        type: string
      deploy:
        type: string
      auth:
        type: string
      multi_tenant:
        type: boolean
      audit:
        type: boolean
      backup:
        type: string
      testing:
        type: string
      monitoring:
        type: string
      maintenance_budget:
        type: string
  do_now:
    type: array
    items:
      $ref: "#/$defs/do_now_item"
  do_not:
    type: array
    items:
      $ref: "#/$defs/do_not_item"
  reserved:
    type: array
    items:
      $ref: "#/$defs/reserved_item"
  undecided:
    type: array
    items:
      $ref: "#/$defs/undecided_item"
  reposition_triggers:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/reposition_trigger"
  source_summary:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/source_item"
  glossary:
    type: array
    items:
      $ref: "#/$defs/glossary_item"
  migration:
    $ref: "#/$defs/migration"
  history:
    type: array
    items:
      $ref: "#/$defs/history_item"
$defs:
  any_value: {}
  do_now_item:
    type: object
    additionalProperties: false
    required: [item, reason]
    properties:
      item:
        type: string
      reason:
        type: string
  do_not_item:
    type: object
    additionalProperties: false
    required: [item, reason, upgrade_trigger]
    properties:
      item:
        type: string
      reason:
        type: string
      upgrade_trigger:
        type: string
  reserved_item:
    type: object
    additionalProperties: false
    required: [item, boundary, trigger]
    properties:
      item:
        type: string
      boundary:
        type: string
      trigger:
        type: string
  undecided_item:
    type: object
    additionalProperties: false
    required: [key, default, reason, review_trigger]
    properties:
      key:
        type: string
      default:
        $ref: "#/$defs/any_value"
      reason:
        type: string
      review_trigger:
        type: string
  reposition_trigger:
    type: object
    additionalProperties: false
    required: [id, condition, action]
    properties:
      id:
        type: string
        pattern: "^RT-[0-9]+$"
      condition:
        type: string
        minLength: 1
      action:
        const: reposition_review
  source_item:
    type: object
    additionalProperties: false
    required: [dimension, status, source]
    properties:
      dimension:
        type: string
      status:
        enum: [explicit, inferred, missing, low_confidence, conflict, undecided, defaulted]
      source:
        type: string
      rule_id:
        type: string
      reason:
        type: string
      confidence:
        type: number
        minimum: 0
        maximum: 1
  glossary_item:
    type: object
    additionalProperties: false
    required: [term, definition]
    properties:
      term:
        type: string
        minLength: 1
      definition:
        type: string
        minLength: 1
      source:
        type: string
  migration:
    type: object
    additionalProperties: false
    required: [strategy, reason, rollback]
    properties:
      strategy:
        enum: [none, rewrite, strangler_fig, dual_run, incremental]
      reason:
        type: string
      rollback:
        type: string
  history_item:
    type: object
    additionalProperties: false
    required: [date, version, change]
    properties:
      date:
        type: string
        format: date
      version:
        type: string
        pattern: "^v[0-9]+\\.[0-9]+$"
      change:
        type: string
