  complete:
    name: complete
    result: fail
    rule_id: QC-003
    detail: unauthenticated 场景未覆盖且 test_notes 未注明不适用原因；令牌失效/被撤销的异常流程缺失
    locations: [acceptance_criteria, exception_flows]
  consistent:
    name: consistent
    result: pass
    rule_id: QC-004
    detail: CON-002、CON-007 已消解并写入 assumptions，剩余一致性 OK
  feasible:
    name: feasible
    result: pass
