decision: revise

issues:
  - check: complete
    severity: blocking
    message: 缺少 unauthenticated 场景验收标准——未受邀请的访问者打开链接、以及令牌失效/被撤销后的行为没有定义
    rule_id: QC-003
    location: acceptance_criteria / exception_flows
    fix: 补 AC-007（未携带有效令牌访问，展示「链接不可用」并给出联系管理员入口）与名为「令牌失效」的异常流程；若确实不适用，必须在 test_notes 写明原因
  - check: unambiguous
    severity: blocking
    message: non_functional 中的「尽快生效」无法验收
    rule_id: QC-001
    location: non_functional[0]
    fix: 替换为可量化描述，例如「从提交验证码到成员出现在成员页 P95 < 1s（本地网络）」

action: 补充 AC-007 与「令牌失效」异常流程，并把「尽快生效」替换成带数字、单位与条件的指标后重新评审。两项改完预计可到 pass。

rerun_advice: 建议两项一次性改完再重跑，不要在半份草稿上反复跑门禁；若第二轮仍存在 blocking 项，按 decision_mapping 转 reject。
