$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/requirement-analysis/traceability.schema.yaml"
title: Requirement traceability matrix
description: 来源 → 需求 → 验收标准 → 实现 的双向追踪表，机器可读版本。
type: object
additionalProperties: false
required:
  - version
  - as_of
  - entries
properties:
  version:
    const: 1
  as_of:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  entries:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/entry"
  orphans:
    type: object
    additionalProperties: false
    properties:
      sources_without_requirement:
        type: array
        items:
          type: string
      requirements_without_source:
        type: array
        items:
          type: string
      acceptance_without_test:
        type: array
        items:
          type: string
  warnings:
    type: array
    items:
      type: string
$defs:
  entry:
    type: object
    additionalProperties: false
    required: [source, requirement_id, version, acceptance_criteria, status]
    properties:
      source:
        type: string
        minLength: 1
      source_type:
        enum: [user_feedback, issue, chat, code, document, meeting, other, unknown]
      requirement_id:
        type: string
        pattern: "^REQ-[0-9]{3}$"
      version:
        type: string
        pattern: "^v[0-9]+\\.[0-9]+$"
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^AC-[0-9]{3}$"
      realization:
        type: array
        items:
          type: string
      status:
        enum: [linked, partially_linked, orphan]
      note:
        type: string
    allOf:
      - if:
          properties:
            acceptance_criteria:
              minItems: 1
            realization:
              minItems: 1
          required: [acceptance_criteria, realization]
        then:
          properties:
            status:
              const: linked
