$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/requirement-analysis/requirement.schema.yaml"
title: Requirement card
type: object
additionalProperties: false
required:
  - id
  - title
  - version
  - status
  - type
  - priority
  - actors
  - goal
  - source
  - triggers
  - main_flow
  - exception_flows
  - data
  - permission
  - acceptance_criteria
  - out_of_scope
  - trace
properties:
  id:
    type: string
    pattern: "^REQ-[0-9]{3}$"
  title:
    type: string
    minLength: 1
  version:
    type: string
    pattern: "^v[0-9]+\\.[0-9]+$"
  status:
    enum: [draft, reviewed, approved, implemented, changed, rejected]
  type:
    enum: [functional, non_functional, data, interface, constraint]
  priority:
    enum: [must, should, could, wont]
  user_story:
    type: string
  actors:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  goal:
    type: string
    minLength: 1
  value:
    type: string
  source:
    type: string
    minLength: 1
  preconditions:
    type: array
    items:
      type: string
      minLength: 1
  triggers:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  main_flow:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  alternate_flows:
    type: array
    items:
      $ref: "#/$defs/flow"
  exception_flows:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/flow"
  data:
    $ref: "#/$defs/data_block"
  interfaces:
    type: array
    items:
      $ref: "#/$defs/interface"
  permission:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  non_functional:
    type: array
    items:
      type: string
      minLength: 1
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/ac"
  out_of_scope:
    type: array
    items:
      type: string
      minLength: 1
  dependencies:
    type: array
    items:
      type: string
  assumptions:
    type: array
    items:
      type: string
  open_questions:
    type: array
    items:
      type: string
  risks:
    type: array
    items:
      $ref: "#/$defs/risk"
  test_notes:
    type: array
    items:
      type: string
  glossary:
    type: array
    items:
      $ref: "#/$defs/term"
  trace:
    $ref: "#/$defs/trace"
  history:
    type: array
    items:
      type: string
  updated_at:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  parent:
    type: string
    pattern: "^REQ-[0-9]{3}$"
  children:
    type: array
    items:
      type: string
      pattern: "^REQ-[0-9]{3}$"
allOf:
  - if:
      properties:
        priority:
          const: must
      required: [priority]
    then:
      properties:
        acceptance_criteria:
          minItems: 2
      comment: 见 PRIO-001，must 至少覆盖正常路径与主要异常
  - if:
      properties:
        priority:
          const: wont
      required: [priority]
    then:
      properties:
        out_of_scope:
          minItems: 1
      comment: 见 PRIO-002，wont 的内容必须显式排除
  - if:
      properties:
        type:
          const: interface
      required: [type]
    then:
      required: [interfaces]
$defs:
  flow:
    type: object
    additionalProperties: false
    required: [name, steps]
    properties:
      name:
        type: string
        minLength: 1
      when:
        type: string
      steps:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  data_block:
    type: object
    additionalProperties: false
    required: [inputs, outputs, entities]
    properties:
      inputs:
        type: array
        items:
          type: string
      outputs:
        type: array
        items:
          type: string
      entities:
        type: array
        items:
          type: string
      retention:
        type: string
  interface:
    type: object
    additionalProperties: false
    required: [name, method, request, response]
    properties:
      name:
        type: string
        minLength: 1
      method:
        enum: [GET, POST, PUT, PATCH, DELETE, EVENT, WEBHOOK, CLI, OTHER]
      request:
        $ref: "#/$defs/any_object"
      response:
        $ref: "#/$defs/any_object"
      errors:
        type: array
        items:
          type: string
      idempotency_key:
        type: string
      auth:
        type: string
  ac:
    type: object
    additionalProperties: false
    required: [id, given, when, then]
    properties:
      id:
        type: string
        pattern: "^AC-[0-9]{3}$"
      scenario:
        enum:
          - happy_path
          - empty_data
          - duplicate
          - permission_denied
          - unauthenticated
          - network_failure
          - boundary
          - concurrency
          - idempotency
          - other
      given:
        type: string
        minLength: 1
      when:
        type: string
        minLength: 1
      then:
        oneOf:
          - type: string
            minLength: 1
          - type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        description: 可观测结果；多条断言时写数组，每条一个断言
      requirement_id:
        type: string
        pattern: "^REQ-[0-9]{3}$"
      test_ref:
        type: string
  risk:
    type: object
    additionalProperties: false
    required: [description, mitigation]
    properties:
      description:
        type: string
        minLength: 1
      level:
        enum: [low, medium, high]
      mitigation:
        type: string
        minLength: 1
      probe:
        type: string
  term:
    type: object
    additionalProperties: false
    required: [term, definition]
    properties:
      term:
        type: string
        minLength: 1
      definition:
        type: string
        minLength: 1
  trace:
    type: object
    additionalProperties: false
    required: [source]
    properties:
      source:
        type: string
        minLength: 1
      source_type:
        enum: [user_feedback, issue, chat, code, document, meeting, other, unknown]
      related:
        type: array
        items:
          type: string
      parent:
        type: string
        pattern: "^REQ-[0-9]{3}$"
      realization:
        type: array
        items:
          type: string
  any_object:
    oneOf:
      - type: object
      - type: string
      - type: array
