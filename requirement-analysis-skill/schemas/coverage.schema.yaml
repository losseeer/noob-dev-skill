$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/requirement-analysis/coverage.schema.yaml"
title: Requirement coverage matrix
description: 单个需求的覆盖矩阵。每个 REQ 一份，文件名 coverage/REQ-xxx.coverage.yaml。
type: object
additionalProperties: false
required:
  - version
  - requirement_id
  - as_of
  - coverage
  - questions
  - skipped
  - defaults_applied
properties:
  version:
    const: 1
  requirement_id:
    type: string
    pattern: "^REQ-[0-9]{3}$"
  title:
    type: string
    minLength: 1
  as_of:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  source_summary:
    type: string
  positioning_context:
    enum: [read, not_found, skipped]
    default: not_found
  coverage:
    type: array
    minItems: 17
    items:
      $ref: "#/$defs/coverage_item"
  questions:
    type: array
    items:
      $ref: "#/$defs/question"
  skipped:
    type: array
    items:
      $ref: "#/$defs/skipped_item"
  defaults_applied:
    type: array
    items:
      $ref: "#/$defs/default_item"
  conflicts:
    type: array
    description: 命中 rules/conflict_rules.yaml 的冲突列表
    items:
      $ref: "#/$defs/conflict_item"
  ready_for_modeling:
    type: boolean
    description: 见 rules/coverage_rules.yaml 的 exit_criteria，未满足必须为 false
$defs:
  value:
    oneOf:
      - type: "null"
      - type: boolean
      - type: number
      - type: string
      - type: array
      - type: object
  evidence:
    type: object
    additionalProperties: false
    required: [source, excerpt]
    properties:
      source:
        type: string
        minLength: 1
      excerpt:
        type: string
        minLength: 1
  coverage_item:
    type: object
    additionalProperties: false
    required: [dimension, priority, status, value, evidence]
    properties:
      dimension:
        enum:
          - actor
          - goal
          - trigger
          - main_flow
          - acceptance
          - data
          - exception
          - permission
          - preconditions
          - alternate_flow
          - non_functional
          - interface
          - dependency
          - glossary
          - trace
          - risk
          - test_notes
      priority:
        enum: [P0, P1, P2]
      status:
        enum: [explicit, inferred, missing, low_confidence, conflict, undecided]
      value:
        $ref: "#/$defs/value"
      evidence:
        type: array
        items:
          $ref: "#/$defs/evidence"
      reason:
        type: string
      confidence:
        type: number
        minimum: 0
        maximum: 1
      rule_id:
        type: string
      review_trigger:
        type: string
    allOf:
      - if:
          properties:
            status:
              enum: [explicit, inferred, low_confidence, conflict, undecided]
          required: [status]
        then:
          properties:
            evidence:
              minItems: 1
      - if:
          properties:
            status:
              const: inferred
          required: [status]
        then:
          required: [reason, confidence]
      - if:
          properties:
            status:
              const: conflict
          required: [status]
        then:
          properties:
            evidence:
              minItems: 2
      - if:
          properties:
            status:
              const: missing
          required: [status]
        then:
          properties:
            value:
              type: "null"
            evidence:
              maxItems: 0
      - if:
          properties:
            status:
              const: undecided
          required: [status]
        then:
          required: [review_trigger]
      - if:
          properties:
            status:
              const: missing
          required: [status]
        then:
          required: [rule_id]
  question:
    type: object
    additionalProperties: false
    required: [id, dimension, priority, reason, prompt, options]
    properties:
      id:
        type: string
        pattern: "^Q[0-9]+$"
      dimension:
        type: string
      priority:
        enum: [P0, P1, P2]
      reason:
        type: string
        minLength: 1
      prompt:
        type: string
        minLength: 1
      rule_id:
        type: string
      options:
        type: array
        minItems: 2
        maxItems: 4
        items:
          type: object
          additionalProperties: false
          required: [label, value, impact]
          properties:
            label:
              type: string
            value:
              $ref: "#/$defs/value"
            impact:
              type: string
      recommendation:
        $ref: "#/$defs/value"
      allow_other:
        type: boolean
  skipped_item:
    type: object
    additionalProperties: false
    required: [dimension, reason]
    properties:
      dimension:
        type: string
      reason:
        type: string
      rule_id:
        type: string
  default_item:
    type: object
    additionalProperties: false
    required: [dimension, value, rule_id, reason, review_trigger]
    properties:
      dimension:
        type: string
      value:
        $ref: "#/$defs/value"
      rule_id:
        type: string
      reason:
        type: string
      review_trigger:
        type: string
  conflict_item:
    type: object
    additionalProperties: false
    required: [rule_id, pair, evidence, severity]
    properties:
      rule_id:
        type: string
        pattern: "^CON-[0-9]{3}$"
      pair:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
      evidence:
        type: array
        minItems: 2
        items:
          $ref: "#/$defs/evidence"
      severity:
        enum: [blocking, warning]
      message:
        type: string
      status:
        enum: [open, resolving, resolved]
      resolution:
        type: string
